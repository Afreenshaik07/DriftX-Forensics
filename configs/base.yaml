project:
  name: "DriftX-Forensics"
  version: "0.1.0"
  random_seed: 42

dataset:
  name: "CMAPSS"
  subset: "FD001"
  rul_cap: 125

model:
  name: "HistGradientBoostingRegressor"
  learning_rate: 0.08
  max_iter: 300
  max_leaf_nodes: 31
  l2_regularization: 0.1

split:
  test_size: 0.2

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  artifacts: "artifacts"
  results: "results"
